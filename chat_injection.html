
    <!-- SUPERINVESTING AI CHAT WIDGET -->
    <div id="chatWidget" style="display:none; position:fixed; bottom:20px; right:20px; width:400px; height:550px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:9999; flex-direction:column;">
      <div style="background:var(--color-surface-light); padding:12px 16px; border-bottom:1px solid var(--color-border); border-radius:12px 12px 0 0; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <strong style="color:var(--color-primary-light); font-family:var(--font-display);">SuperInvesting AI</strong>
          <div style="font-size:0.7rem; color:var(--color-text-muted);">Institutional Equity Strategist</div>
        </div>
        <button onclick="toggleChat()" style="background:transparent; border:none; color:var(--color-text-muted); cursor:pointer; font-size:1.2rem;">✖</button>
      </div>
      <div id="chatHistory" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; font-size:0.85rem; line-height:1.5;">
        <div style="background:rgba(16, 185, 129, 0.1); border:1px solid var(--color-green); padding:10px 14px; border-radius:8px; color:var(--color-text-primary); max-width:85%; align-self:flex-start;">
          Hello. I am SuperInvesting AI. I have analyzed the fundamental, macro, and quantitative pipeline data. How can I advise your portfolio today?
        </div>
      </div>
      <div style="padding:12px; border-top:1px solid var(--color-border); display:flex; gap:8px;">
        <input type="text" id="chatInput" placeholder="Ask about valuation, risks, or targets..." style="flex:1; background:var(--color-bg); border:1px solid var(--color-border); color:var(--color-text-primary); padding:10px; border-radius:6px; font-size:0.85rem;" onkeypress="if(event.key === 'Enter') sendChatMessage()">
        <button onclick="sendChatMessage()" style="background:var(--color-teal); color:#fff; border:none; border-radius:6px; padding:0 16px; cursor:pointer; font-weight:bold;">Send</button>
      </div>
    </div>
    <button id="chatToggleBtn" onclick="toggleChat()" style="display:none; position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:var(--color-primary-light); border:none; box-shadow:0 4px 15px rgba(0,0,0,0.3); z-index:9998; cursor:pointer; font-size:1.5rem; color:#fff; display:flex; align-items:center; justify-content:center;">
      💬
    </button>
    <script>
      let chatContext = {};
      let chatMessages = [];
      
      function toggleChat() {
        const widget = document.getElementById('chatWidget');
        const btn = document.getElementById('chatToggleBtn');
        if(widget.style.display === 'none') {
          widget.style.display = 'flex';
          btn.style.display = 'none';
        } else {
          widget.style.display = 'none';
          btn.style.display = 'flex';
        }
      }

      async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;
        
        input.value = '';
        appendMessage('user', text);
        chatMessages.push({role: 'user', content: text});
        
        const typingId = appendMessage('assistant', 'Analyzing institutional data...', true);
        
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              messages: chatMessages,
              context_data: chatContext
            })
          });
          const data = await res.json();
          document.getElementById(typingId).remove();
          
          if(data.reply) {
            appendMessage('assistant', data.reply);
            chatMessages.push({role: 'assistant', content: data.reply});
          } else {
            appendMessage('assistant', 'Error: No reply received.');
          }
        } catch(e) {
          document.getElementById(typingId).remove();
          appendMessage('assistant', 'Connection error: ' + e.message);
        }
      }
      
      function appendMessage(role, text, isTyping=false) {
        const history = document.getElementById('chatHistory');
        const msgDiv = document.createElement('div');
        const id = 'msg_' + Math.random().toString(36).substr(2,9);
        msgDiv.id = id;
        
        // Simple markdown parsing for bold and line breaks
        let formattedText = text.replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1</strong>');
        formattedText = formattedText.replace(/\\n/g, '<br>');
        
        if (role === 'user') {
          msgDiv.style.cssText = 'background:var(--color-primary); padding:10px 14px; border-radius:8px; color:#fff; max-width:85%; align-self:flex-end;';
        } else {
          msgDiv.style.cssText = 'background:rgba(16, 185, 129, 0.1); border:1px solid var(--color-green); padding:10px 14px; border-radius:8px; color:var(--color-text-primary); max-width:85%; align-self:flex-start;';
          if(isTyping) msgDiv.style.opacity = '0.7';
        }
        msgDiv.innerHTML = formattedText;
        history.appendChild(msgDiv);
        history.scrollTop = history.scrollHeight;
        return id;
      }
    </script>
